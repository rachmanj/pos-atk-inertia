<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d9488">
    <title>Offline — POS Kasir</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #0f172a;
            padding: 24px;
            text-align: center;
        }
        .card {
            max-width: 360px;
        }
        img {
            width: 72px;
            height: 72px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: #0d9488;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #64748b;
            margin-bottom: 24px;
        }
        button {
            background: #0d9488;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:active { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/assets/pwa/icon-192.png" alt="POS Kasir">
        <h1>Anda sedang offline</h1>
        <p>Koneksi internet tidak tersedia. Periksa jaringan Anda lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
