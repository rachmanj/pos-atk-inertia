<VirtualHost *:80>
    ServerName pos-atk.dea-geekom.ts.net
    ServerAlias dea-geekom.tailnet-name.ts.net
    DocumentRoot /home/deahermes/pos-atk-inertia/public

    <Directory /home/deahermes/pos-atk-inertia/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pos-atk-error.log
    CustomLog ${APACHE_LOG_DIR}/pos-atk-access.log combined
</VirtualHost>
