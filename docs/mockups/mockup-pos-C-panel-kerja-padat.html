<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VASIA POS · Mockup C · Panel Kerja Padat</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--primary:#2A3B8F;--accent:#FF6A2E;--paper:#EFEDE3;--kanvas:#FFFFFF;--tinta:#1B1D29;--garis:#C9C4B4;--muted:#5A5E70;--ok:#2F6F4E;--err:#8B2E3B;--r:8px;--r-lg:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--tinta);-webkit-font-smoothing:antialiased;font-size:13px}
  .num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
  .display{font-family:"Space Grotesk",sans-serif}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .app{max-width:1400px;margin:0 auto;padding:12px 14px 14px}
  header.top{display:flex;align-items:center;gap:12px;padding:4px 2px 10px}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .mark{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-family:"Space Grotesk"}
  .brand span{font-size:11px;color:var(--muted);display:block}
  .keys{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px}
  .keys kbd{font:600 10.5px "JetBrains Mono",monospace;border:1px solid var(--garis);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:#fff;color:#3C4053}
  .shift{display:flex;align-items:center;gap:8px;background:var(--kanvas);border:1px solid var(--garis);border-radius:var(--r);padding:6px 10px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .shift small{color:var(--muted);font-size:11px}.kasir{font-weight:600;font-size:12.5px}
  .grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:12px;align-items:start}
  .panel{background:var(--kanvas);border:1px solid var(--garis);border-radius:var(--r-lg)}

  .left{display:grid;grid-template-columns:150px minmax(0,1fr)}
  .rail{border-right:1px solid #E3E0D4;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
  .rail h3{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:2px 8px 8px;font-weight:600}
  .rail button{text-align:left;padding:7px 8px;border-radius:6px;font-size:12.5px;display:flex;justify-content:space-between;gap:6px;color:#3C4053}
  .rail button small{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:10.5px}
  .rail button:hover{background:#F7F5EE}
  .rail button[aria-pressed=true]{background:#EEF0FB;color:var(--primary);font-weight:600}
  .rail button[aria-pressed=true] small{color:#5A67B8}
  .main{padding:11px 12px 6px;min-width:0}
  .searchrow{display:flex;gap:8px}
  .scan{position:relative;flex:1}
  .scan svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
  input[type=search]{width:100%;padding:11px 11px 11px 36px;border:1px solid var(--garis);border-radius:var(--r);font-size:13.5px;background:#fff}
  .fbtn{padding:10px 12px;border:1px solid var(--garis);border-radius:var(--r);background:#fff;font-size:12.5px;font-weight:600;white-space:nowrap}
  .fbtn[aria-pressed=true]{background:#EEF0FB;border-color:var(--primary);color:var(--primary)}
  table{width:100%;border-collapse:collapse;margin-top:0}
  .tw{overflow-x:auto;margin-top:10px}
  thead th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid #E3E0D4;font-weight:600}
  tbody tr{border-bottom:1px solid #F1EFE6}
  tbody tr:hover{background:#FBFAF5}
  td{padding:8px;vertical-align:middle}
  td.nm{font-weight:600}
  td.nm small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
  td.r{text-align:right;font-family:"JetBrains Mono",monospace}
  .pill{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:6px;background:#F1EFE6;border:1px solid #E3E0D4;color:#4A4E63}
  .pill.low{background:#FFF1EA;color:#9A3412;border-color:#F7C6AE;font-weight:600}
  .add{border:1px solid var(--primary);color:var(--primary);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;background:#fff}
  .add:hover{background:var(--primary);color:#fff}
  .tablefoot{display:flex;justify-content:space-between;align-items:center;padding:9px 8px 4px;color:var(--muted);font-size:11.5px}
  .tablefoot .pager{display:flex;gap:5px}
  .tablefoot .pager button{border:1px solid var(--garis);border-radius:6px;padding:3px 8px;background:#fff;font-size:11.5px}
  .tablefoot .pager button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
  .none{padding:30px 10px;text-align:center;color:var(--muted)}

  /* KANAN */
  .right{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
  .tabs{display:flex;border-bottom:1px solid var(--garis)}
  .tabs button{flex:1;padding:11px 8px;font-size:12.5px;font-weight:600;color:#3C4053;border-bottom:2px solid transparent}
  .tabs button[aria-pressed=true]{color:var(--primary);border-bottom-color:var(--primary);background:#FBFBFE}
  .tabbody{flex:1;overflow:auto;min-height:140px;padding:4px 12px}
  .pane{display:none}.pane.on{display:block}
  .row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed #E3E0D4}
  .row .info{flex:1;min-width:0}
  .row .nm{font-size:12.5px;font-weight:600;line-height:1.3}
  .row .u{font-size:11px;color:var(--muted);margin-top:2px;font-family:"JetBrains Mono",monospace}
  .qty{display:flex;align-items:center;border:1px solid var(--garis);border-radius:6px;height:28px;overflow:hidden}
  .qty button{width:26px;height:27px;background:#fff;font-weight:600}
  .qty button:hover{background:#F7F5EE}
  .qty span{width:30px;text-align:center;font-size:12.5px;font-weight:600}
  .row .amt{width:74px;text-align:right;font-size:12.5px;font-weight:600}
  .fieldset{display:flex;flex-direction:column;gap:9px;padding:11px 6px}
  .fieldset label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
  .fieldset input,.fieldset select,.fieldset textarea{width:100%;padding:9px 10px;border:1px solid var(--garis);border-radius:var(--r);font-family:inherit;font-size:12.5px;background:#fff}
  .emptycart{text-align:center;color:var(--muted);padding:26px 10px;font-size:12.5px;line-height:1.7}
  .foot{padding:11px 12px 13px;border-top:1px solid var(--garis)}
  .fr{display:flex;justify-content:space-between;font-size:12.5px;color:#3C4053;padding:2.5px 0}
  .fr.big{border-top:2px solid var(--tinta);margin-top:6px;padding-top:7px;font-size:15px;font-weight:600;color:var(--tinta)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}
  .keypad button{border:1px solid var(--garis);border-radius:6px;padding:9px 0;background:#fff;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600}
  .keypad button:hover{background:#F7F5EE}
  .methods{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}
  .method{padding:8px 4px;border:1px solid var(--garis);border-radius:var(--r);font-size:12px;font-weight:600;background:#fff}
  .method[aria-pressed=true]{border-color:var(--primary);background:#EEF0FB;color:var(--primary)}
  .bayar{width:100%;margin-top:9px;padding:14px;border-radius:var(--r);background:var(--accent);color:#3A1403;font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;align-items:center}
  .bayar kbd{font:600 11px "JetBrains Mono",monospace;background:rgba(255,255,255,.45);padding:2px 6px;border-radius:5px}
  .bayar:disabled{background:#DCD8CA;color:#6E7285;cursor:not-allowed}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#13315C;color:#fff;padding:11px 16px;border-radius:var(--r);font-size:13px;transition:.22s ease;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:1060px){.grid{grid-template-columns:1fr}.right{position:static;max-height:none}.left{grid-template-columns:1fr}.rail{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid #E3E0D4}.rail h3{display:none}}
  @media (max-width:700px){.col-kat{display:none}td,th{padding:7px 6px}td.nm small{display:none}.keys{display:none}header.top{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark">V</div><div><b>VASIA STATIONERY</b><span>Kasir · POS-ATK</span></div></div>
    <div class="keys"><kbd>F2</kbd> cari <kbd>F4</kbd> pelanggan <kbd>F6</kbd> diskon <kbd>F9</kbd> bayar</div>
    <div class="shift"><span class="dot"></span><div><div class="kasir">Ririn</div><small>Shift terbuka · 19:41</small></div></div>
  </header>

  <div class="grid">
    <section class="panel left">
      <div class="rail" id="rail"></div>
      <div class="main">
        <div class="searchrow">
          <div class="scan">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Scan barcode atau cari nama produk  (F2)" autofocus>
          </div>
          <button class="fbtn" aria-pressed="true" id="fStok">Stok ada</button>
          <button class="fbtn" aria-pressed="false" id="fLow">Stok menipis</button>
        </div>
        <div class="tw">
        <table>
          <thead><tr><th>Produk</th><th class="col-kat">Kategori</th><th style="width:96px">Stok</th><th style="width:110px;text-align:right">Harga</th><th style="width:74px"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        </div>
        <div class="tablefoot">
          <span id="info">Menampilkan 0 produk</span>
          <span class="pager"><button aria-pressed="true">1</button><button>2</button><button>3</button><button>›</button></span>
        </div>
      </div>
    </section>

    <aside class="panel right">
      <div class="tabs" id="tabs">
        <button aria-pressed="true" data-tab="cart">Keranjang <span class="num" id="cnt">0</span></button>
        <button aria-pressed="false" data-tab="cust">Pelanggan</button>
        <button aria-pressed="false" data-tab="note">Catatan</button>
      </div>
      <div class="tabbody">
        <div class="pane on" id="pane-cart"><div id="items"></div></div>
        <div class="pane" id="pane-cust">
          <div class="fieldset">
            <div><label>Pelanggan</label><select><option>Umum</option><option>SDN 001 Balikpapan</option><option>CV Karya Abadi</option><option>SMPN 3 Balikpapan</option></select></div>
            <div><label>No. telepon (opsional)</label><input placeholder="08xx"></div>
            <div><label>Catatan untuk nota</label><textarea rows="3" placeholder="Contoh: titip dulu, diambil besok"></textarea></div>
          </div>
        </div>
        <div class="pane" id="pane-note">
          <div class="fieldset">
            <div><label>Diskon cepat</label>
              <div class="methods"><button class="method" data-disc="5">5%</button><button class="method" data-disc="10">10%</button><button class="method" data-disc="0">Tanpa</button></div>
            </div>
            <div><label>Keterangan tambahan</label><textarea rows="3" placeholder="Mis. pesanan toko, ambil sendiri"></textarea></div>
          </div>
        </div>
      </div>
      <div class="foot">
        <div class="fr"><span>Subtotal</span><span class="num" id="sub">Rp 0</span></div>
        <div class="fr"><span>Diskon</span><span class="num" id="discTxt">Rp 0</span></div>
        <div class="fr big"><span>TOTAL</span><span class="num" id="tot">Rp 0</span></div>
        <div class="fr" style="margin-top:6px"><span>Uang diterima</span><span class="num" id="uang">Rp 0</span></div>
        <div class="fr"><span>Kembalian</span><span class="num" id="kembali">Rp 0</span></div>
        <div class="keypad" id="keypad"></div>
        <div class="methods" id="methods">
          <button class="method" aria-pressed="true">Tunai</button>
          <button class="method" aria-pressed="false">Transfer</button>
          <button class="method" aria-pressed="false">Digital</button>
        </div>
        <button class="bayar" id="bayar"><span>Bayar</span><kbd>F9</kbd></button>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PRODUK = [
  {id:1, nama:"METERAI 10000", kat:"ATK Umum", harga:12000, stok:14},
  {id:2, nama:"COVER BC FOLIO WARNA TUA", kat:"ATK Umum", harga:2000, stok:39},
  {id:3, nama:"KERTAS DF GARIS SD 100V", kat:"Kertas", harga:600, stok:260},
  {id:4, nama:"COVER BC FOLIO WARNA MUDA", kat:"ATK Umum", harga:1000, stok:270},
  {id:5, nama:"GLUE STICK MONTANA 15GR", kat:"ATK Umum", harga:6000, stok:8},
  {id:6, nama:"KARTON BC SUPER WARNA MUDA", kat:"ATK Umum", harga:5000, stok:15},
  {id:7, nama:"COVER MIKA BENING", kat:"ATK Umum", harga:1000, stok:188},
  {id:8, nama:"KERTAS KILAP", kat:"Kertas", harga:3000, stok:34},
  {id:9, nama:"ULTRAMILK PLAIN 200 ML", kat:"ATK Umum", harga:7000, stok:43},
  {id:10, nama:"ULTRA MILK STRAWBERY 200ML", kat:"ATK Umum", harga:7000, stok:19},
  {id:11, nama:"ULTRA MILK COKLAT 200ML", kat:"ATK Umum", harga:7000, stok:43},
  {id:12, nama:"TAPE PLAKBAND NACHI 1 1/2 X 12", kat:"Alat Tulis Kantor", harga:18000, stok:3},
  {id:13, nama:"PULPEN KENKO K1", kat:"Pulpen", harga:4000, stok:72},
  {id:14, nama:"GUNTING KUKU 777 MEDIUM", kat:"ATK Umum", harga:5000, stok:12},
  {id:15, nama:"PALETTE CAT AIR V-TEC RD1725", kat:"Kuas & Cat", harga:13800, stok:3},
  {id:16, nama:"PENSIL WARNA KENKO 24W", kat:"Pensil", harga:42000, stok:3}
];
const KAT = [["Semua",1580],["ATK Umum",1580],["Alat Tulis Kantor",364],["Pensil",197],["Pulpen",175],["Buku",156],["Kertas",156],["Lem & Perekat",72],["Spidol",71],["Penggaris",57],["Map & Amplop",56]];
const rp = n => "Rp " + n.toLocaleString("id-ID");
let cart = [], katAktif = "Semua", cari = "", hanyaLow = false, metode = "Tunai", uangDiterima = 0, persenDisc = 0, uangBuf = "";

function renderRail(){
  document.getElementById("rail").innerHTML = `<h3>Kategori</h3>` + KAT.map(([n,j]) =>
    `<button aria-pressed="${n===katAktif}" data-kat="${n}"><span>${n}</span><small>${j.toLocaleString("id-ID")}</small></button>`).join("");
  document.querySelectorAll("#rail button").forEach(b => b.onclick = () => { katAktif = b.dataset.kat; renderRail(); renderTable(); });
}
function renderTable(){
  const list = PRODUK.filter(p => (katAktif==="Semua" || p.kat===katAktif) && (!hanyaLow || p.stok<=8) && p.nama.toLowerCase().includes(cari.toLowerCase()));
  document.getElementById("rows").innerHTML = list.length ? list.map(p => `
    <tr>
      <td class="nm">${p.nama}<small>${p.id} · dijual per pcs</small></td>
      <td class="col-kat"><span class="pill">${p.kat}</span></td>
      <td><span class="pill ${p.stok<=8?"low":""}">${p.stok} pcs</span></td>
      <td class="r">${rp(p.harga)}</td>
      <td style="text-align:right"><button class="add" data-id="${p.id}">Tambah</button></td>
    </tr>`).join("") : `<tr><td colspan="5" class="none">Tidak ada produk yang cocok. Ubah kata kunci, kategori, atau filter stok.</td></tr>`;
  document.getElementById("info").textContent = `Menampilkan ${list.length} dari 3.053 produk aktif`;
  document.querySelectorAll(".add").forEach(b => b.onclick = () => tambah(+b.dataset.id));
}
function tambah(id){ const it = cart.find(x=>x.id===id); it ? it.qty++ : cart.push({...PRODUK.find(x=>x.id===id), qty:1}); renderCart(); }
function renderCart(){
  const box = document.getElementById("items");
  box.innerHTML = cart.length ? cart.map(i => `
    <div class="row">
      <div class="info"><div class="nm">${i.nama}</div><div class="u">${rp(i.harga)} /pcs</div></div>
      <div class="qty"><button data-minus="${i.id}">−</button><span>${i.qty}</span><button data-plus="${i.id}">+</button></div>
      <div class="amt num">${rp(i.harga*i.qty)}</div>
      <button data-del="${i.id}" style="color:var(--err);font-size:11px" aria-label="Hapus">✕</button>
    </div>`).join("") : `<div class="emptycart">Keranjang kosong.<br>Klik "Tambah" di tabel produk, atau scan barcode.</div>`;
  box.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{cart.find(x=>x.id==b.dataset.plus).qty++;renderCart();});
  box.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{const it=cart.find(x=>x.id==b.dataset.minus);it.qty--;if(it.qty<1)cart=cart.filter(x=>x.id!=it.id);renderCart();});
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!=b.dataset.del);renderCart();});
  const sub = cart.reduce((s,i)=>s+i.harga*i.qty,0);
  const disc = Math.round(sub*persenDisc/100);
  const tot = Math.max(0, sub-disc);
  document.getElementById("cnt").textContent = cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById("sub").textContent = rp(sub);
  document.getElementById("discTxt").textContent = rp(disc) + (persenDisc ? ` (${persenDisc}%)` : "");
  document.getElementById("tot").textContent = rp(tot);
  document.getElementById("uang").textContent = rp(uangDiterima);
  document.getElementById("kembali").textContent = rp(Math.max(0, uangDiterima-tot));
  document.getElementById("bayar").disabled = cart.length===0;
}
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
document.getElementById("q").oninput = e => { cari = e.target.value; renderTable(); };
document.getElementById("fStok").onclick = () => { hanyaLow=false; document.getElementById("fStok").setAttribute("aria-pressed","true"); document.getElementById("fLow").setAttribute("aria-pressed","false"); renderTable(); };
document.getElementById("fLow").onclick = () => { hanyaLow=true; document.getElementById("fLow").setAttribute("aria-pressed","true"); document.getElementById("fStok").setAttribute("aria-pressed","false"); renderTable(); };
document.querySelectorAll("#tabs button").forEach(t => t.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed", x===t));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-"+t.dataset.tab));
});
document.querySelectorAll("[data-disc]").forEach(b => b.onclick = () => {
  persenDisc = +b.dataset.disc; renderCart(); toast(persenDisc ? "Diskon " + persenDisc + "% diterapkan" : "Diskon dihapus");
});
document.getElementById("keypad").innerHTML = [1,2,3,4,5,6,7,8,9,"000",0,"⌫"].map(k => `<button data-k="${k}">${k}</button>`).join("");
document.querySelectorAll("#keypad button").forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  if(k==="⌫") uangBuf = uangBuf.slice(0,-1); else uangBuf = (uangBuf + k).slice(0,9);
  uangDiterima = +uangBuf || 0; renderCart();
});
document.querySelectorAll("#methods .method").forEach(m => m.onclick = () => { metode = m.textContent; document.querySelectorAll("#methods .method").forEach(x=>x.setAttribute("aria-pressed", x===m)); });
document.getElementById("bayar").onclick = () => { toast("Pembayaran " + metode + " · " + rp(cart.reduce((s,i)=>s+i.harga*i.qty,0)) + " (mockup)"); };
document.addEventListener("keydown", e => { if(e.key==="F9"){e.preventDefault();document.getElementById("bayar").click();} if(e.key==="F2"){e.preventDefault();document.getElementById("q").focus();} });
tambah(1); tambah(3); tambah(3); tambah(5);
renderRail(); renderTable();
</script>
</body>
</html>
